<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CVCF Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#0f172a}

.top{background:#07142b;color:white;padding:26px 32px}
.top h1{margin:0;font-size:28px}
.top p{margin:8px 0 0;color:#cbd5e1}

.wrap{max-width:1500px;margin:auto;padding:24px}

.nav{display:flex;gap:10px;flex-wrap:wrap;background:white;border:1px solid #e2e8f0;border-radius:18px;padding:10px;margin-bottom:20px}
.nav button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:#f1f5f9}
.nav button.active{background:#07142b;color:white}

.toolbar{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap}

input,select{border:1px solid #cbd5e1;border-radius:12px;padding:12px}
input{flex:1;min-width:300px}

.filters{display:flex;gap:8px}
.filters button{border:0;border-radius:999px;padding:8px 12px;background:#e2e8f0;font-weight:700;cursor:pointer}
.filters button.active{background:#07142b;color:white}

.lead-grid{
  display:grid;
  grid-template-columns:1fr; /* 🔥 KEY CHANGE */
  gap:18px;
}

.card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:18px;
  cursor:pointer;
}

.card.active{outline:3px solid #07142b}

.row{display:flex;justify-content:space-between}

.title{font-size:20px;font-weight:900}

.badge{
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:800;
}

.green{background:#dcfce7;color:#166534}
.yellow{background:#fef3c7;color:#92400e}
.red{background:#fee2e2;color:#991b1b}
.blue{background:#dbeafe;color:#1e40af}

.section-title{font-size:22px;font-weight:900;margin:10px 0}

.detail{
  margin-top:20px;
  background:white;
  padding:20px;
  border-radius:18px;
  border:1px solid #e2e8f0;
}

.kv{display:flex;justify-content:space-between;margin:6px 0}

</style>
</head>

<body>

<header class="top">
  <h1>CVCF Admin Dashboard</h1>
  <p>Customer leads, VIN-based vehicle profiles, offers, assignments, notes, inventory, and P&L.</p>
</header>

<main class="wrap">

<nav class="nav">
  <button class="active">Customers</button>
  <button>Inventory</button>
  <button>Buyers</button>
  <button>Tow Drivers</button>
  <button>P&L</button>
</nav>

<div class="toolbar">
  <input id="search" placeholder="Search VIN, last 6, ID, or seller name" />

  <div class="filters" id="filters">
    <button class="active">All</button>
    <button>New Lead</button>
    <button>Quote Pending</button>
    <button>Offer Sent</button>
    <button>Accepted</button>
    <button>Declined</button>
  </div>

  <select id="limit">
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="50">50</option>
  </select>
</div>

<h2 class="section-title">Transactions</h2>

<div id="leadList" class="lead-grid"></div>

<div id="detail"></div>

</main>

<script>

const leads = [
  {id:"CV-10290",status:"New Lead",car:"2021 Tesla Model 3",seller:"Sarah Kim",city:"Clovis",offer:"Not sent"},
  {id:"CV-10289",status:"Quote Pending",car:"2001 Ford F-150",seller:"Anthony Perez",city:"Fresno",offer:"$1,200"},
  {id:"CV-10288",status:"Accepted",car:"2012 Honda Accord",seller:"Maria Hernandez",city:"Fresno",offer:"$800"},
  {id:"CV-10287",status:"Offer Sent",car:"2004 Toyota Corolla",seller:"Jose Ramirez",city:"Clovis",offer:"$450"},
  {id:"CV-10286",status:"Declined",car:"2017 Nissan Sentra",seller:"Kevin Lee",city:"Fresno",offer:"$350"},
];

let selected = leads[0];

function render(){

  const list = document.getElementById("leadList");

  list.innerHTML = leads.map(l=>`
    <div class="card ${selected.id===l.id?'active':''}" onclick="selectLead('${l.id}')">

      <div class="row">
        <div>
          <div class="title">${l.car}</div>
          <div>${l.id}</div>
        </div>
        <div class="badge ${getColor(l.status)}">${l.status}</div>
      </div>

      <div class="row">
        <span>Seller</span><b>${l.seller}</b>
      </div>

      <div class="row">
        <span>City</span><b>${l.city}</b>
      </div>

      <div class="row">
        <span>Offer</span><b>${l.offer}</b>
      </div>

      <div style="margin-top:10px" onclick="event.stopPropagation()">
        <select>
          <option>Select buyer</option>
          <option>Fresno Auto Wholesale</option>
          <option>Valley Budget Autos</option>
        </select>
      </div>

    </div>
  `).join("");

  document.getElementById("detail").innerHTML = `
    <div class="detail">
      <h2>${selected.car}</h2>
      <div class="kv"><b>Seller</b><span>${selected.seller}</span></div>
      <div class="kv"><b>City</b><span>${selected.city}</span></div>
      <div class="kv"><b>Status</b><span>${selected.status}</span></div>
      <div class="kv"><b>Offer</b><span>${selected.offer}</span></div>
    </div>
  `;
}

function selectLead(id){
  selected = leads.find(l=>l.id===id);
  render();
}

function getColor(status){
  if(status==="Accepted") return "green";
  if(status==="Quote Pending" || status==="Offer Sent") return "yellow";
  if(status==="Declined") return "red";
  return "blue";
}

render();

</script>

</body>
</html>
