<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVCF Offer Form</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#eef2f6;margin:0;padding:20px}
.container{max-width:760px;margin:auto}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px;border:1px solid #d8e1ec}
input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
button{padding:12px;background:#07142b;color:#fff;border:none;border-radius:6px;width:100%;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:none}.step.active{display:block}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:12px;color:#555}
</style>
</head>

<body>
<div class="container">

<form id="form">

<div class="card step active" data-step="1">
<h3>Vehicle</h3>

<input id="vin" placeholder="VIN (optional)">
<button type="button" id="decode">Decode VIN</button>

<div class="two">
<input id="year" placeholder="Year (required)">
<input id="make" placeholder="Make (required)">
</div>

<div class="two">
<input id="model" placeholder="Model (required)">
<select id="trim"><option value="">Choose trim</option><option value="__manual">Other</option></select>
</div>

<input id="manualTrim" style="display:none" placeholder="Enter trim manually">

<div class="two">
<input id="body" placeholder="Body Type">
<input id="drivetrain" placeholder="Drivetrain">
</div>

<div class="two">
<input id="fuel" placeholder="Fuel">
<input id="engineInfo" placeholder="Engine">
</div>

<div class="two">
<input id="transmissionInfo" placeholder="Transmission">
<select id="color">
<option value="">Choose color</option>
<option>White</option><option>Black</option><option>Silver</option>
<option>Gray</option><option>Blue</option><option>Red</option>
<option value="__manual">Other</option>
</select>
</div>

<input id="manualColor" style="display:none" placeholder="Enter color manually">

<input id="miles" placeholder="Mileage (required)">
</div>

<div class="card step" data-step="2">
<h3>Condition</h3>

<select id="runs"><option value="">Runs?</option><option>Yes</option><option>No</option><option>Not sure</option></select>
<select id="key"><option value="">Key?</option><option>Yes</option><option>No</option><option>Not sure</option></select>
<select id="tires"><option value="">Tires?</option><option>Yes</option><option>No</option><option>Not sure</option></select>
<select id="engine"><option value="">Engine OK?</option><option>Yes</option><option>No</option><option>Not sure</option></select>
<select id="trans"><option value="">Transmission OK?</option><option>Yes</option><option>No</option><option>Not sure</option></select>
</div>

<div class="card step" data-step="3">
<h3>Title</h3>
<select id="title"><option>Clean</option><option>No Title</option><option>Salvage</option></select>
</div>

<div class="card step" data-step="4">
<h3>Location</h3>
<input id="zip" placeholder="ZIP (required)">
<input id="address" placeholder="Address (optional)">
</div>

<div class="card step" data-step="5">
<h3>Seller</h3>

<div class="two">
<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">
</div>

<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">
</div>

<div class="nav">
<button type="button" id="back">Back</button>
<button type="button" id="next">Next</button>
</div>

</form>

<div id="success" style="display:none;text-align:center">
<h2>Thank you</h2>
<p>Submitting...</p>
</div>

</div>

<script>
const supabase = window.supabase.createClient(
"https://psxqggcmfkmhkrsganuv.supabase.co",
"sb_publishable_J9Z4Bx_hqt26gjC_zUEGfg_L8t4VF9A"
);

let step=1;
const steps=document.querySelectorAll('.step');

function showStep(){
steps.forEach((s,i)=>s.classList.toggle('active',i===step-1));
}
document.getElementById('next').onclick=()=>{if(step<5){step++;showStep()}else submitForm();}
document.getElementById('back').onclick=()=>{if(step>1){step--;showStep()}}

document.getElementById('trim').onchange=e=>{
document.getElementById('manualTrim').style.display=e.target.value==="__manual"?"block":"none";
};

document.getElementById('color').onchange=e=>{
document.getElementById('manualColor').style.display=e.target.value==="__manual"?"block":"none";
};

document.getElementById('decode').onclick=decodeVIN;

async function decodeVIN(){
const vin=document.getElementById('vin').value;
if(vin.length<11)return;

const res=await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvaluesextended/${vin}?format=json`);
const data=(await res.json()).Results[0];

year.value=data.ModelYear;
make.value=data.Make;
model.value=data.Model;
body.value=data.BodyClass;
fuel.value=data.FuelTypePrimary;
engineInfo.value=data.EngineModel||data.EngineCylinders+" cyl";
transmissionInfo.value=data.TransmissionStyle;

if(!drivetrain.value && data.BodyClass?.includes("Sedan")) drivetrain.value="FWD";
}

async function submitForm(){

if(!year.value||!make.value||!model.value||!miles.value){
alert("Missing required fields");
return;
}

const condition = [
runs.value,key.value,tires.value,engine.value,trans.value
];

const {error} = await supabase.from('leads').insert([{
vin:vin.value,
year:year.value,
make:make.value,
model:model.value,
trim:trim.value==="__manual"?manualTrim.value:trim.value,
body:body.value,
drive:drivetrain.value,
fuel:fuel.value,
engine:engineInfo.value,
trans:transmissionInfo.value,
color:color.value==="__manual"?manualColor.value:color.value,
miles:miles.value,
seller:(firstName.value+" "+lastName.value).trim(),
phone:phone.value,
email:email.value,
zip:zip.value,
address:address.value,
title:title.value,
condition:condition
}]);

if(error){
alert("Error saving lead");
return;
}

form.style.display="none";
success.style.display="block";

setTimeout(()=>location.href="thank-you.html",1000);
}
</script>

</body>
</html>
