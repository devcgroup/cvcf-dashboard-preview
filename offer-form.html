<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CVCF Offer Form</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#eef2f6;padding:20px}
.container{max-width:700px;margin:auto;background:white;padding:25px;border-radius:12px}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
button{background:#07142b;color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold}
</style>
</head>

<body>

<div class="container">
<h2>Sell Your Car</h2>

<form id="form">

<input placeholder="VIN" id="vin">
<input placeholder="Year" id="year">
<input placeholder="Make" id="make">
<input placeholder="Model" id="model">
<input placeholder="Miles" id="miles">

<input placeholder="Name" id="seller">
<input placeholder="Phone" id="phone">
<input placeholder="Email" id="email">

<input placeholder="ZIP" id="zip">
<input placeholder="Address" id="address">

<textarea placeholder="Vehicle Description" id="desc"></textarea>

<button type="submit">Submit</button>

</form>
</div>

<script>
const SUPABASE_URL = "https://psxqggcmfkmhkrsganuv.supabase.co";
const SUPABASE_KEY = "sb_publishable_J9Z4Bx_hqt26gjC_zUEGfg_L8t4VF9A";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("form").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const { error } = await db.from("leads").insert([{
    vin: vin.value,
    year: year.value,
    make: make.value,
    model: model.value,
    miles: miles.value,
    seller: seller.value,
    phone: phone.value,
    email: email.value,
    zip: zip.value,
    address: address.value,
    vehicle_description: desc.value
  }]);

  if(error){
    alert("Error saving lead");
    console.log(error);
    return;
  }

  window.location.href = "thank-you.html";
});
</script>

</body>
</html>
